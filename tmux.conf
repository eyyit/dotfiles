# Set command seq
set -g prefix C-a
bind-key a send-prefix
bind-key C-a last-window
bind-key space next-window

# Automatically renumber windows on close.
set-option -g renumber-windows on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format \
  "#{pane_current_command}#{?pane_dead,[dead],}"
set-option -g set-titles on
set-option -g set-titles-string "#S:#I:#W - \"#T\""

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use Control-arrow keys without prefix key to resize panes
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5

# Use Control-Shift-arrow keys without prefix key to resize panes
bind -n C-S-Left resize-pane -L
bind -n C-S-Right resize-pane -R
bind -n C-S-Up resize-pane -U
bind -n C-S-Down resize-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Terminal and 24-bit TrueColor setup
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"
set -g bell-action any
set -g visual-bell on
set -g focus-events on

# Mouse mode and clipboard sync (strictly disabled)
set -g mouse off
set -s set-clipboard off

# Copy mode
unbind [
bind Escape copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -sg escape-time 75

# Native zoom toggles (z, !, `)
bind-key z resize-pane -Z
bind-key ! resize-pane -Z
bind-key ` resize-pane -Z

# Floating popup scratchpad
bind-key g display-popup -E -w 80% -h 80% "$SHELL"

# Should help with multiple connections
setw -g aggressive-resize on

# confirm before killing a window or the server
bind-key k confirm kill-window
bind-key K confirm kill-server

# Keep current path in new windows and panes
bind c new-window -c "#{pane_current_path}"

# more intuitive keybindings for splitting
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind N next-layout

# History
set -g history-limit 50000

# windows
bind m command-prompt "move-window -t '%%'"
bind i choose-window

# make reloading the config easy
bind r source-file ~/.tmux.conf

# Quick pane layout to tiled
bind-key t select-layout tiled

# pane movement
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind-key @ choose-window 'join-pane -h -s "%%"'

# pane navigation
# Add -r to use repeat-time (default 500ms) to allow multiple commands
# without pressing prefix again.
bind-key -r    Up select-pane -U
bind-key -r  Down select-pane -D
bind-key -r  Left select-pane -L
bind-key -r Right select-pane -R

# Display panes # lasts longer (5 sec)
set -g display-panes-time 5000

# Sync panes
bind-key y set-window-option synchronize-panes on \;\
  set-window-option pane-active-border-style fg=red \;\
  set-window-option pane-border-style fg=yellow \;\
  display-message "Sync panes ON"
bind-key Y set-window-option synchronize-panes off \;\
  set-window-option pane-active-border-style fg=green \;\
  set-window-option pane-border-style default \;\
  display-message "Sync panes OFF"

# Statusbar
set -g status on
set -g status-interval 1
set -g status-style "bg=black,fg=white"
set -g status-left \
  "#(~/.dotfiles/scripts/tmux_statusleft.sh #{session_name} #{client_width})"
set -g status-left-length 150
set -g window-status-separator ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right \
  "#(~/.dotfiles/scripts/tmux_statusline.sh #{client_width} #{session_name})"
set -g status-right-length 85

# Redraw status line immediately on distinct interactive window events
set-hook -g after-new-window 'refresh-client -S'
set-hook -g after-select-window 'refresh-client -S'
set-hook -g after-kill-pane 'refresh-client -S'
set-hook -g after-resize-pane 'refresh-client -S'
